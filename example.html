<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liquid Glass · 最小示例</title>
<style>
  body{margin:0;min-height:100vh;color:#fff;font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;
       display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:48px 20px}
  h1{margin:0;font-size:clamp(2rem,6vw,3rem);text-align:center}
  .card{padding:28px 36px;max-width:420px;line-height:1.7}
  .pill{--lg-radius:999px;padding:14px 34px;font-weight:700;cursor:pointer;border:0;color:inherit;font:inherit}
  #orb{position:fixed;left:50%;top:22vh;width:180px;height:100px;margin-left:-90px;--lg-radius:46px;
       display:flex;align-items:center;justify-content:center;font-weight:700;z-index:40}
</style>
</head>
<body>

<h1>Hello, Liquid Glass</h1>

<div class="liquid-glass card">这是一块液态玻璃：边缘会折射背后的内容，滚动页面或拖动小玻璃试试。</div>
<button class="liquid-glass pill">一个按钮</button>

<!-- data-lg-top：最上层玻璃，能折射其他玻璃里的文字，文字由 DOM 自己画（可拖动） -->
<div class="liquid-glass" id="orb" data-lg-top>拖动我</div>

<script src="liquid-glass.js"></script>
<script>
  const lg = LiquidGlass.init({ text: 'h1' })   // h1 在玻璃“背后”，所以要被折射
  LiquidGlass.draggable(document.getElementById('orb'))
  console.log('当前渲染器：', lg.renderer)        // 'webgl' 或 'css'
</script>
</body>
</html>
